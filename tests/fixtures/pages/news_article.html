<p>Wiesbaden (dpa) - In Deutschland sind im vergangenen Jahr so wenige Kinder geboren worden wie seit Jahrzehnten nicht mehr.</p>
<p>Kurz.</p>
<p>Die Geburtenrate sank nach Angaben des Statistischen Bundesamts auf 1,32 Kinder je Frau.</p>
