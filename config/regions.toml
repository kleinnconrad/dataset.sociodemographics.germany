# Registry of the German regions collected by the sociodemographics dataset.
#
# Every [[region]] entry is one region of the NUTS classification of the European Union:
#   geo             NUTS code: DE (Germany), DE1 to DEG (the 16 states, NUTS 1), four characters for the
#                   38 government regions and statistical regions (NUTS 2), five characters for the districts
#                   and district-free cities (NUTS 3)
#   name            name of the region in the NUTS classification
#   nuts            versions of the classification (2016, 2021, 2024) that contain the code with this territory
#   added           day on which the region was added; start of collection
#   removed         optional day on which the region was removed, with removed_reason
#   notes           optional remarks
# The level, the parent region and the ISO 3166-2 code of the state follow from the code (src/regions.py).
#
# Codes of earlier versions keep their entries: Eurostat datasets that still use an earlier version publish
# their data under them. NUTS 2024 gave six districts of Thüringen new codes because their territories changed,
# among others by the merger of Eisenach (DEG0N) into the Wartburgkreis in 2021: DEG04, DEG0B, DEG0F, DEG0H, DEG0I
# and DEG0P became DEG0S, DEG0Q, DEG0T, DEG0V, DEG0U and DEG0R. All thirteen codes are collected.
#
# Rules (CLAUDE.md, section 9): codes are never changed or reused; a region that is no longer collected keeps
# its entry with removed = <date> and removed_reason = "..."; new codes are taken from the NUTS
# classification published by Eurostat (github.com/eurostat/Nuts2json, files pub/v2/<version>/4326/nutspt_*.json).
#
# All entries were taken from the NUTS 2016, 2021 and 2024 files of Eurostat on 2026-10-26.

[[region]]
geo = "DE"
name = "Deutschland"
nuts = ["2016", "2021", "2024"]
added = 2026-10-26

