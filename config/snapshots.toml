# =============================================================================================================
# Sources that were checked and are not collected
# =============================================================================================================

[[excluded]]
id = "bka.polizeiliche_kriminalstatistik"
name = "Bundeskriminalamt, Polizeiliche Kriminalstatistik (tables by state and district)"
url = "https://www.bka.de/DE/AktuelleInformationen/StatistikenLagebilder/PolizeilicheKriminalstatistik/pks_node.html"
checked = 2026-10-26
reason = "The robots.txt of www.bka.de sets a crawl delay of 180 seconds, longer than the maximum of 120 seconds of the pipeline: a check of the page, robots.txt, the TDM file and the tables would take 10 to 15 minutes of a run. The terms of reuse could not be read for the same reason (a secondary source names the Datenlizenz Deutschland 2.0 for the PKS yearbook). The PKS tables for Germany are collected through GENESIS-Online (statistic 24911); tables by state and district are not collected."

[[excluded]]
id = "dbk.kirchliche_statistik"
name = "Deutsche Bischofskonferenz, Kirchliche Statistik (Catholic Church by diocese and state)"
url = "https://www.dbk.de/themen/kirche-staat-und-recht/kirchliche-statistik"
checked = 2026-10-26
reason = "The website answers automated requests with HTTP 401 (bot protection); the statistics are published as PDF only."

[[excluded]]
id = "ekd.kirchenmitgliederzahlen"
name = "Evangelische Kirche in Deutschland, Kirchenmitgliederzahlen (members by regional church and state, Catholics by state)"
url = "https://www.ekd.de/kirchenmitgliederzahlen-downloads-44413.htm"
checked = 2026-10-26
reason = "The imprint reserves all rights of use (Eine weitere Verwendung ist ohne ausdrückliche Genehmigung der Rechteinhaber untersagt); the xlsx reports by regional church and state can be fetched (robots.txt allows them), but their redistribution is not permitted without a permission of the EKD."

[[excluded]]
id = "ba.statistik"
name = "Statistik der Bundesagentur für Arbeit (labour market by district, monthly)"
url = "https://statistik.arbeitsagentur.de/"
checked = 2026-10-26
reason = "The website answers automated requests with HTTP 403, and the robots.txt of the data API statistik-dr.arbeitsagentur.de disallows it. Unemployment by district is collected as an annual table of the Regionaldatenbank and in the structural data of the constituencies."

[[excluded]]
id = "bamf.asylgeschaeftsstatistik"
name = "Bundesamt für Migration und Flüchtlinge, Asylgeschäftsstatistik (monthly asylum figures)"
url = "https://www.bamf.de/DE/Themen/Statistik/Asylzahlen/asylzahlen-node.html"
