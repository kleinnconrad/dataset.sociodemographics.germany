# Snapshot sources: items that their sources overwrite, remove or revise without keeping a history.
#
# Every [[snapshot]] entry describes one published item (see src/snapshots.py):
#   id              stable id <provider>.<item>; never reused for another meaning
#   name            name of the item
#   topic           topic group (SeriesTopic in src/schema.py)
#   provider        provider id of config/providers.toml
#   format          genesis (table of a GENESIS database), csv, xlsx, json, html (table of a page) or pdf
#   table           table code of a GENESIS database (format genesis)
#   expect          regular expression that the title of a GENESIS table (required), or the file name and column
#                   names of a file, must match; content without a match is not stored
#   url             fixed address of a file, or
#   page, link      page that links the current file, and a regular expression of the file address
#   geo_scheme      region codes in the content: nuts, ags (official keys), constituency (numbers of the Bundestag
#                   constituencies), state_name (names of the states), diocese, regional_church or none
#   archive         store the published file itself in data/files/ (always for pdf)
#   check_days      days between two checks; 0 (default) checks in every run
#   update_days     days within which the source is expected to change the content; the monthly review reports
#                   an item without change for longer
#   startyear, regionalvariable, regionalkey   options of a GENESIS table request
#   csv.*, xlsx.*, html.*   format options (delimiter, encoding, skip_lines, header_pattern;
#                           sheet, sheet_pattern, header_row or header_pattern, header_rows; table)
#   added           day on which the entry was added; start of collection
#   removed         day on which the entry was removed, with removed_reason
#
# Every [[excluded]] entry records a source that was checked and is not collected, with the day of the check and
# the reason (robots.txt, text-and-data-mining reservation, bot protection, terms of use, no machine-readable data).
#
# Rules (CLAUDE.md, sections 8 and 9): every new source is checked with the fetch rules and its terms of use before
# it is added (source review with the input probe); every new or changed address or table code is verified against
# the live source; every change is recorded in the measurement log of project_architecture.md.

# =============================================================================================================
# GENESIS-Online of the Statistisches Bundesamt (secret GENESIS_TOKEN)
#
# The tables are overwritten with every update: provisional figures are replaced by final ones and earlier
# years are revised without versions. Without a token the tables are counted as no_access. The expect pattern
# protects against a table code that is changed or reused by the database. Without startyear the web service
# returns the default selection of a table, often only the last years; startyear sets the first year of the
# stored window, within the limit of 40,000 values per table.
# =============================================================================================================

