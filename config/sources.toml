# News outlets and issuers of press releases of the feeds collector. The monthly source review (src/press_review.py,
# run by src/source_review.py in the workflow source_review.yml) checks every source and proposes changes as a pull
# request. The comment line above each entry records the check that admitted it: entries taken over from
# dataset.politics.germany (checked 2026-10-19) and dataset.economics.germany (checked 2026-10-25) keep the result of
# that check (time span of the items of each feed and news sitemap in hours, reasons for fetch_pages); feeds and sources
# added here were checked on 2026-10-28 with the probe of source_review.yml (robots.txt, TDM reservation, bot
# protection, feed response).
# Lifecycle keys of every source:
#   added = YYYY-MM-DD           day on which the source was added to the list
#   removed = YYYY-MM-DD         day on which the source was removed; the entry stays, so that its coverage period is known
#   removed_reason = "..."       why the source was removed
#   keep = true                  the review does not propose a removal for low yield
# Outlets have an outlet_type, the publisher group (owner_group), the paywall model, the state of a regional outlet
# (home_state) and the topic of a specialist outlet (topic, a value of SocialTopic in src/schema.py). Press sources have
# an actor_type and a jurisdiction (DE, a state code, EU or INT).
# topic_filter: items are stored only if they come from a feed of a sociodemographic section or contain a
# sociodemographic term (SOCIAL_TERMS in src/collectors/feeds.py). Default: true for outlets except specialist_press,
# false for press sources; issuers whose releases cover many other topics set it to true.
# [[excluded]] entries at the end are candidates that were checked and not admitted. The search does not propose
# them again. Status blocked, tdm_reserved, terms, duplicate and not_relevant are permanent; entries with no_feed,
# inactive or robots and a kind are checked again by every review and added when they pass.

