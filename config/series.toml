# =============================================================================================================
# Births and fertility (Eurostat)
#
# The total fertility rate by citizenship of the mother is not published as a series; it follows from
# live_births_by_mother_age_citizenship and women_by_age_citizenship as five times the sum of the
# age-specific rates (births per woman of each five-year age group).
# =============================================================================================================

[[series]]
concept = "total_fertility_rate"
name = "Total fertility rate (children per woman)"
topic = "births_and_fertility"
frequency = "A"
unit = "live births per woman"
provider = "eurostat"
flow = "demo_r_find3"
key = "A.NR.TOTFERRT.{geo}"
geo_levels = ["country", "nuts1", "nuts2", "nuts3"]
added = 2026-10-26

[[series]]
