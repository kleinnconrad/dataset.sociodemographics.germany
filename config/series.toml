# Catalog of the statistical series collected by the sociodemographics dataset.
#
# Every [[series]] entry describes one concept at one provider:
#   concept         what the series measure (lower-case snake_case); the first part of every series id
#   name            name of the concept
#   topic           topic group (SeriesTopic in src/schema.py)
#   frequency       W weekly, M monthly, Q quarterly, A annual
#   unit            unit of the values
#   provider        eurostat or ecb (SDMX 2.1 REST)
#   flow            dataset or dataflow of the provider
#   key             SDMX key template: {geo} and one placeholder per breakdown dimension, the other positions
#                   fixed codes of the provider
#   geo_levels      levels of the German regions of config/regions.toml: country, nuts1 (states),
#                   nuts2 (government regions), nuts3 (districts)
#   geos            further areas for comparison: EU27_2020
#   breakdown.<dim> codes of the provider for the placeholder {<dim>}; every combination is a series
#   added           day on which the entry was added; start of collection
#   notes           optional remarks, e.g. the meaning of codes
# Each area and combination of breakdown codes is a series with the id <concept>.<geo>[.<code>...], e.g.
# population_by_age_group.DE212.F.Y20-24, the join key series_id of the dataset sociodemographic_series.
#
# Rules (CLAUDE.md, section 9): concepts and series ids are never changed or reused for another meaning; an
# entry that is no longer collected keeps its place with removed = <date> and removed_reason = "..."; every
# new or changed key is verified against the live provider before it is committed; every change of a key,
# unit, code or provider is recorded in the measurement log of project_architecture.md.

# =============================================================================================================
# Population structure (Eurostat, population on 1 January)
# =============================================================================================================

[[series]]
concept = "population"
name = "Population on 1 January by broad age group and sex"
topic = "population_structure"
frequency = "A"
unit = "persons on 1 January"
provider = "eurostat"
flow = "demo_r_pjanaggr3"
key = "A.NR.{sex}.{age}.{geo}"
geo_levels = ["country", "nuts1", "nuts2", "nuts3"]
breakdown.sex = ["T", "M", "F"]
breakdown.age = ["TOTAL", "Y_LT15", "Y15-64", "Y_GE65"]
notes = "T total, M males, F females; the shares of men and women follow from the three series of a region"
added = 2026-10-26

