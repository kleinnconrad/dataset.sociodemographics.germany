# Providers of the statistical series and their terms of use.
#
# Every [[provider]] entry describes one organization and interface:
#   id                 provider id of config/series.toml and of the records (field provider)
#   name               name of the organization
#   api                base URL of the interface
#   license            terms of reuse as stored in the field license of the records
#   attribution        attribution required when the data is reused
#   terms_url          page with the terms of reuse; the monthly source review fetches it
#   terms_hash         hash of the text of the terms page as last reviewed; set by the source review
#   terms_hash_since   day on which the source review recorded terms_hash
#   notes              optional remarks
#
# The monthly source review (src/source_review.py) compares the text of every terms page with terms_hash.
# A changed text is reported in the review pull request together with the new hash; read the terms before
# merging, and record a change of the license in the measurement log of project_architecture.md.

[[provider]]
id = "eurostat"
name = "Eurostat"
api = "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1"
license = "Eurostat (reuse authorised with acknowledgement of the source)"
attribution = "Source: Eurostat"
terms_url = "https://ec.europa.eu/eurostat/help/copyright-notice"
notes = "Statistical data, metadata and publications may be reused for commercial or non-commercial purposes provided the source is acknowledged; data that Eurostat marks as belonging to third parties is excluded."

[[provider]]
id = "ecb"
name = "European Central Bank"
api = "https://data-api.ecb.europa.eu/service"
license = "ECB (reuse free of charge with acknowledgement of the source)"
attribution = "Source: ECB statistics"
terms_url = "https://www.ecb.europa.eu/stats/ecb_statistics/governance_and_quality_framework/html/usage_policy.en.html"
notes = "Policy regarding the reuse of ESCB statistics: free of charge for commercial and non-commercial use, provided the source is quoted and the data are not altered."

# Providers of the snapshot sources (config/snapshots.toml)

[[provider]]
id = "destatis"
name = "Statistisches Bundesamt (Destatis)"
api = "https://genesis.destatis.de/genesisWS/rest/2020"
license = "Datenlizenz Deutschland - Namensnennung - Version 2.0"
attribution = "Datenquelle: Statistisches Bundesamt (Destatis), Genesis-Online; Datenlizenz by-2-0"
terms_url = "https://www.destatis.de/DE/Service/Impressum/copyright-genesis-online.html"
notes = "GENESIS-Online (web service with a free account) and the files of www.destatis.de (Statistische Berichte). The page Copyright allgemein (https://www.destatis.de/DE/Service/Impressum/copyright-allgemein.html) permits the reproduction and distribution of texts, data and graphics, also in extracts, with a reference to the source, for non-commercial and commercial purposes."

[[provider]]
id = "regionalstatistik"
name = "Statistische Ämter des Bundes und der Länder, Regionaldatenbank Deutschland"
api = "https://www.regionalstatistik.de/genesisws/rest/2020"
license = "Datenlizenz Deutschland - Namensnennung - Version 2.0"
attribution = "Statistische Ämter des Bundes und der Länder, Regionaldatenbank Deutschland; Datenlizenz by-2-0"
terms_url = "https://www.statistikportal.de/de/open-data"
notes = "The robots.txt of www.regionalstatistik.de disallows every path; the web service is called as a documented API, whose base URL the open-data page of the statistical offices names for programmatic use. Needs a free account. Tables of the Bundesagentur für Arbeit in the database name it as source."

[[provider]]
id = "zensus2022"
name = "Statistische Ämter des Bundes und der Länder, Zensus 2022"
api = "https://ergebnisse.zensus2022.de/api/rest/2020"
license = "Datenlizenz Deutschland - Namensnennung - Version 2.0"
attribution = "Statistische Ämter des Bundes und der Länder, Zensus 2022; Datenlizenz by-2-0"
terms_url = "https://www.statistikportal.de/de/open-data"
notes = "Zensus database (web service with a free account) and the special evaluations of the Zensus 2022 on www.destatis.de. The files state: Sie können Informationen speichern, (auch auszugsweise) mit Quellenangabe weitergeben, vervielfältigen und verbreiten."

[[provider]]
id = "bundeswahlleiterin"
name = "Die Bundeswahlleiterin"
api = "https://www.bundeswahlleiterin.de"
license = "Datenlizenz Deutschland - Namensnennung - Version 2.0"
attribution = "© Die Bundeswahlleiterin, Wiesbaden; raw data of columns 35 to 48 of the structural data: © Bundesagentur für Arbeit"
terms_url = "https://www.bundeswahlleiterin.de/info/impressum.html"
notes = "The imprint permits the reproduction and distribution, also in extracts, with a reference to the source, for non-commercial and commercial purposes; the CSV files state the Datenlizenz Deutschland - Namensnennung - Version 2.0."
